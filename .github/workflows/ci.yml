name: Xenon CI
on:
  pull_request:
    branches: [main]
    paths-ignore: [flake.lock]
  push:
    branches: [main]
    paths-ignore: [flake.lock]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xenon-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: validate-xenon
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record initial disk capacity
        shell: bash
        run: |
          df -h / "$RUNNER_TEMP"
          df -i / "$RUNNER_TEMP"
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Validate and compare complete systems
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          base=$BASE_SHA
          if [[ ! $base =~ ^[0-9a-f]{40}$ || $base == 0000000000000000000000000000000000000000 ]]; then
            base=$(git rev-parse HEAD^)
          fi
          nix flake lock path:"$PWD"
          pin=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache"
          nix shell "github:NixOS/nixpkgs/$pin#nixfmt" "github:NixOS/nixpkgs/$pin#actionlint" \
            "github:NixOS/nixpkgs/$pin#shellcheck" "github:NixOS/nixpkgs/$pin#python3" \
            -c scripts/gitops-ci "$base" "$RUNNER_TEMP/xenon-report"
      - name: Record final disk capacity
        if: always()
        shell: bash
        run: |
          {
            echo '## Runner disk capacity after validation'
            echo '```text'
            df -h / /nix/store "$RUNNER_TEMP"
            df -i / /nix/store "$RUNNER_TEMP"
            echo '```'
            echo 'Disk exhaustion blocks validation. Use adequate isolated runner capacity; do not skip system builds.'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Xenon validation'
            echo 'See job status and xenon-diagnostics artifact. A build does not test hardware or activation.'
            for file in changed-files.txt update-policy.txt downgrades.txt sensitive-config.diff; do
              if [[ -f "$RUNNER_TEMP/xenon-report/$file" ]]; then
                echo "### $file"
                echo '```text'
                head -c 20000 "$RUNNER_TEMP/xenon-report/$file"
                echo
                echo '```'
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: xenon-diagnostics
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/xenon-report/*.json
            ${{ runner.temp }}/xenon-report/*.diff
            ${{ runner.temp }}/xenon-report/*.txt
