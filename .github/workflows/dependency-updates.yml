name: Prepare dependency PR
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
    inputs:
      trial:
        description: 'One-shot update PR trial; does not enable the daily schedule'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: xenon-dependency-update
  cancel-in-progress: false
jobs:
  update:
    # Schedule stays gated off; an explicit trial allows one approved manual run.
    if: github.repository == 'paulstaab/nixos-config' && github.ref == 'refs/heads/main' && ((github.event_name == 'schedule' && vars.ENABLE_UPDATE_PRS == 'true') || (github.event_name == 'workflow_dispatch' && inputs.trial))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      # Only trusted main can request CI. CI itself has contents:read only.
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Prepare constrained PR from trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pin=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          nix shell "github:NixOS/nixpkgs/$pin#python3" -c scripts/gitops-update
