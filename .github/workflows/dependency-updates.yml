name: Prepare dependency PR
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: xenon-dependency-update
  cancel-in-progress: false
jobs:
  update:
    # Disabled until the owner explicitly configures this repository variable.
    if: github.repository == 'paulstaab/nixos-config' && github.ref == 'refs/heads/main' && vars.ENABLE_UPDATE_PRS == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Prepare constrained PR from trusted main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pin=$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)
          nix shell "github:NixOS/nixpkgs/$pin#python3" -c scripts/gitops-update
